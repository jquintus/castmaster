<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141815">
    <meta name="description" content="A visual guide to the Taskmaster contestants from the UK, New Zealand, and Australia.">
    <title>Castmaster</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://upload.wikimedia.org">
    <link rel="stylesheet" href="../styles.css?v=e9ce64ad90">
    <script defer src="../data.js?v=e9ce64ad90"></script>
    <script defer src="../app.js?v=e9ce64ad90"></script>
  </head>
  <body data-show="uk" data-season="21" data-base="../" data-version="e9ce64ad90">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../" aria-label="Castmaster, all series">
          <span class="brand-mark" aria-hidden="true">TM</span>
          <span class="brand-name">CAST<span>MASTER</span></span>
        </a>
        <nav class="show-nav" aria-label="Shows">
          <a data-show-link="uk" href="../">UK</a>
          <a data-show-link="nz" href="../nz/">New Zealand</a>
          <a data-show-link="au" href="../au/">Australia</a>
        </nav>
        <div class="picker-wrap">
          <label for="series-search">Jump to a season or contestant</label>
          <div class="combobox">
            <input id="series-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" autocomplete="off" placeholder="Search season or name…">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <div id="search-results" class="search-results" role="listbox" hidden></div>
          </div>
        </div>
      </div>
    </header>

    <main id="main">
      <div class="intro">
        <div class="intro-topline"><span class="red-rule"></span> <span id="intro-label">THE CAST, IN ORDER</span></div>
        <h1 id="page-title"></h1>
        <a id="all-series-link" class="back-link" href="../" hidden></a>
      </div>
      <div id="series-list" class="series-list"></div>
    </main>

    <footer class="site-footer">
      <span>Unofficial Taskmaster cast guide.</span>
      <span>Portraits from Taskmaster Wiki.</span>
    </footer>
  </body>
</html>
